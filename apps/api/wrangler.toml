name = "agenflow-back"
main = "src/index.ts"
compatibility_date = "2026-05-12"
compatibility_flags = ["nodejs_compat"]

# Subrequest budget: custom [limits] subrequests requires a paid Workers plan (Free deploy fails API 100328).
# On Free, rely on default limits + small hydrate batches. Upgrade and set limits in the dashboard if needed.

# Cron: every 15m (hydrate/refresh/SaaS backfill/audit prune) plus a daily 08:00 UTC name burst.
# LOCATION_NAME_CRON_BATCH="0" (below) skips the extra unnamed-only hydrate; stale refresh now
# includes blank names. Set it > 0 in Dashboard if you still want a dedicated unnamed drain.
#
# Name refresh (do NOT pin these in [vars] — deploys overwrite Dashboard):
#   LOCATION_NAMES_REFRESH_BATCH — 15-minute lookups (unset defaults to 8 in code; "0" disables).
#   LOCATION_NAMES_DAILY_CRON_BATCH — daily burst lookups (unset defaults to 15; "0" disables).
#   LOCATION_NAMES_REFRESH_STALE_AFTER_DAYS — eligibility window (unset defaults to 1).
#   LOCATION_NAMES_REFRESH_HOUR_UTC — if set ("0"-"23"), only the 15-minute refresh runs in that hour.
[triggers]
crons = ["*/15 * * * *", "0 8 * * *"]

[vars]
LOCATION_NAME_CRON_BATCH = "0"
# Do not put CLIENT_CHARGES_CHARGING_ENABLED here — wrangler [vars] overwrite Dashboard on every
# deploy. Set it only in Cloudflare Worker Settings (true/1/yes to allow live Stripe charges).

[[queues.producers]]
binding = "MESSAGE_QUEUE"
queue = "agentflow-ghl-webhooks"

[[queues.consumers]]
queue = "agentflow-ghl-webhooks"
