name = "agenflow-back"
main = "src/index.ts"
compatibility_date = "2026-05-12"
compatibility_flags = ["nodejs_compat"]

# Subrequest budget: custom [limits] subrequests requires a paid Workers plan (Free deploy fails API 100328).
# On Free, rely on default limits + small hydrate batches. Upgrade and set limits in the dashboard if needed.

# Cron runs every 15m; LOCATION_NAME_CRON_BATCH="0" (default below) skips GHL hydration for unnamed locations.
# Set LOCATION_NAME_CRON_BATCH to e.g. 8 in Dashboard or `[vars]` to drain blank `locations.name` over time.
#
# Optional rename drift sweeps (requires DB migration `0010_location_name_synced_at`):
#   LOCATION_NAMES_REFRESH_BATCH — max GHL lookups per tick for rows that already have a display name (e.g. "4").
#   LOCATION_NAMES_REFRESH_STALE_AFTER_DAYS — eligibility window (default "2").
#   LOCATION_NAMES_REFRESH_HOUR_UTC — if set ("0"-"23"), only run refresh batches during that UTC hour.
[triggers]
crons = ["*/15 * * * *"]

[vars]
LOCATION_NAME_CRON_BATCH = "0"
# Marketplace install URL is pinned here so Worker deploys pick up a new app version_id.
# Do not put CLIENT_CHARGES_CHARGING_ENABLED here — wrangler [vars] overwrite Dashboard on every
# deploy. Set it only in Cloudflare Worker Settings (true/1/yes to allow live Stripe charges).
GHL_VERSION_ID = "6a6b5864ba65c71d784c0347"
GHL_INSTALL_URL = "https://marketplace.gohighlevel.com/v2/oauth/chooselocation?response_type=code&client_id=6a035ee24b80374d79d8c5c0-mp2xo4p3&version_id=6a6b5864ba65c71d784c0347"
GHL_OAUTH_START_URL = "https://marketplace.gohighlevel.com/v2/oauth/chooselocation?response_type=code&redirect_uri=https%3A%2F%2Fapi.agentflow.autowiz.net%2Foauth%2Fgohighlevel%2Fcallback&client_id=6a035ee24b80374d79d8c5c0-mp2xo4p3&scope=contacts.readonly+conversations.readonly+conversations.write+conversations%2Fmessage.readonly+conversations%2Fmessage.write+conversations%2Freports.readonly+conversations%2Flivechat.write+locations.readonly+locations%2Ftags.readonly+locations%2Ftags.write+locations%2FcustomValues.readonly+oauth.write+oauth.readonly+invoices.readonly+invoices%2Fschedule.readonly+payments%2Forders.readonly+payments%2Forders.collectPayment+payments%2Fintegration.readonly+payments%2Ftransactions.readonly+payments%2Fsubscriptions.readonly+payments%2Fcoupons.readonly+payments%2Fcustom-provider.readonly+opportunities.readonly+opportunities.write+calendars.readonly+calendars%2Fevents.readonly+calendars%2Fgroups.readonly+calendars%2Fresources.readonly+charges.readonly+charges.write+saas%2Flocation.read+saas%2Fcompany.read&version_id=6a6b5864ba65c71d784c0347"

[[queues.producers]]
binding = "MESSAGE_QUEUE"
queue = "agentflow-ghl-webhooks"

[[queues.consumers]]
queue = "agentflow-ghl-webhooks"
