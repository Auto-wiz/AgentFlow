# Typecheck + test on every push. Deploys agenflow-back when GitHub Actions secrets exist.
#
# Required for deploy (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Workers Edit (same as Cloudflare Builds "agenflow-back build token")
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare dashboard URL or Workers overview
#
# Stripe webhooks hit the API Worker only: https://api.agentflow.autowiz.net/webhooks/stripe
# (Cloudflare Pages / agentflow-web is the dashboard front — it does not receive Stripe webhooks.)

name: API Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: api-worker-main
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run check -w @agentflow/api
      - run: npm run test -w @agentflow/api

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Detect Cloudflare deploy credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping API Worker deploy — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub Actions secrets."
            echo "::notice::Until then, deploy agenflow-back via Cloudflare Workers Builds or: cd apps/api && npx wrangler deploy"
          fi

      - name: Install dependencies
        if: steps.cf.outputs.ready == 'true'
        run: npm ci

      - name: Deploy agenflow-back (API)
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy
