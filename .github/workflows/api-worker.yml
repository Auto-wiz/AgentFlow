# Typecheck on every push. On push to main, deploys **agenflow-back** (API / Stripe webhooks).
#
# ── Recommended (uses your Cloudflare Workers Builds config) ──
# 1. Cloudflare → Workers → agenflow-back → Settings → Builds → Deploy Hooks → Create hook (branch: main)
# 2. GitHub → Auto-wiz/AgentFlow → Settings → Secrets → Actions → New secret:
#      CLOUDFLARE_WORKER_DEPLOY_HOOK_URL = paste the hook URL
#
# Each push to main runs check here, then POSTs the hook → Cloudflare runs Build + Deploy (same as manual git push should).
#
# ── Alternative ──
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID → wrangler deploy from GitHub (skip hook).

name: API Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: api-worker-main
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and typecheck (same as Cloudflare Build)
        run: npm run cf-build-api

      - name: API unit tests
        run: npm run test -w @agentflow/api

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Workers Build (agenflow-back)
        id: hook
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -sfS -X POST "$DEPLOY_HOOK"
            echo "Triggered Cloudflare Workers Builds for agenflow-back."
            echo "used=hook" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "used=none" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.hook.outputs.used == 'none'

      - uses: actions/setup-node@v4
        if: steps.hook.outputs.used == 'none'
        with:
          node-version: "22"
          cache: npm

      - name: Detect wrangler deploy credentials
        id: wrangler
        if: steps.hook.outputs.used == 'none'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via wrangler
        if: steps.hook.outputs.used == 'none' && steps.wrangler.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy

      - name: Require deploy configuration
        if: steps.hook.outputs.used == 'none' && steps.wrangler.outputs.ready != 'true'
        run: |
          echo "::error::API Worker was NOT deployed. Production (api.agentflow.autowiz.net) is unchanged."
          echo "::error::Add GitHub secret CLOUDFLARE_WORKER_DEPLOY_HOOK_URL (recommended — create under Workers → agenflow-back → Builds → Deploy Hooks)."
          echo "::error::Or add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID for wrangler deploy."
          echo "::error::Also check Cloudflare → agenflow-back → Deployments: git push builds may have stopped (reconnect GitHub under Builds)."
          exit 1
