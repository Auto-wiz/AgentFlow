# Deploy agenflow-back on every push to main (same intent as Cloudflare Workers Builds).
# One-time setup: GitHub repo → Settings → Secrets → Actions
#   CLOUDFLARE_API_TOKEN  (Workers edit; same capability as "agenflow-back build token")
#   CLOUDFLARE_ACCOUNT_ID
#
# If Cloudflare Dashboard also runs "Deploy command" on git push, disable that deploy step
# OR omit GitHub secrets here — otherwise each push deploys twice.

name: Deploy API Worker

on:
  push:
    branches: [main]

concurrency:
  group: deploy-api-worker-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck API
        run: npm run check -w @agentflow/api

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy
